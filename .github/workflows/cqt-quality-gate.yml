name: CQT Quality Gate

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-check:
    name: CQT Quality Check
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Run CQT repository scan
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          CQT_API_URL: ${{ secrets.CQT_API_URL }}
          CQT_PROJECT_ID: ${{ secrets.CQT_PROJECT_ID }}
          CQT_MIN_SCORE: ${{ secrets.CQT_MIN_SCORE }}
          CQT_OWNER: CTLR-Z
          CQT_REPO: TESTING
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:CQT_API_URL)) {
            throw "Missing GitHub secret: CQT_API_URL"
          }

          if ([string]::IsNullOrWhiteSpace($env:CQT_PROJECT_ID)) {
            throw "Missing GitHub secret: CQT_PROJECT_ID"
          }

          $minimumScore = 80
          if (-not [string]::IsNullOrWhiteSpace($env:CQT_MIN_SCORE)) {
            $parsedScore = 0
            if (-not [int]::TryParse($env:CQT_MIN_SCORE, [ref]$parsedScore)) {
              throw "CQT_MIN_SCORE must be an integer."
            }
            $minimumScore = $parsedScore
          }

          $apiBase = $env:CQT_API_URL.TrimEnd("/")
          $endpoint = "$apiBase/api/github/pat/scan"

          $payload = @{
            project_id = $env:CQT_PROJECT_ID.Trim()
            owner = $env:CQT_OWNER
            repo = $env:CQT_REPO
            branch = $env:PR_HEAD_BRANCH
            selected_rule_keys = $null
            selected_rule_ids = @()
          } | ConvertTo-Json -Depth 5

          Write-Host "Starting CQT quality scan..."
          Write-Host "Repository: $env:CQT_OWNER/$env:CQT_REPO"
          Write-Host "Branch: $env:PR_HEAD_BRANCH"
          Write-Host "Minimum required score: $minimumScore"

          try {
            $response = Invoke-RestMethod `
              -Uri $endpoint `
              -Method Post `
              -ContentType "application/json" `
              -Body $payload `
              -TimeoutSec 900
          }
          catch {
            Write-Host "CQT API request failed."
            if ($_.ErrorDetails.Message) {
              Write-Host $_.ErrorDetails.Message
            }
            throw
          }

          if ($null -eq $response.score) {
            throw "CQT API response did not contain a score."
          }

          $score = [int]$response.score
          $findings = if ($null -ne $response.total_findings) {
            $response.total_findings
          } else {
            "unknown"
          }

          Write-Host "----------------------------------------"
          Write-Host "CQT scan completed"
          Write-Host "Run ID: $($response.run_id)"
          Write-Host "Score: $score"
          Write-Host "Total findings: $findings"
          Write-Host "Critical: $($response.critical_count)"
          Write-Host "High: $($response.high_count)"
          Write-Host "Medium: $($response.medium_count)"
          Write-Host "Low: $($response.low_count)"
          Write-Host "----------------------------------------"

          if ($score -lt $minimumScore) {
            throw "CQT quality gate failed: score $score is below required score $minimumScore."
          }

          Write-Host "CQT quality gate passed."
