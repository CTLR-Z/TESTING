name: CQT Quality Gate

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-check:
    name: Code Quality Scan
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify PowerShell
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "PowerShell is working."
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "Pull request: $env:PR_NUMBER"

        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Code Quality Scan
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          CQT_API_URL: http://127.0.0.1:8000
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Starting CQT Quality Scan..."

          # IMPORTANT:
          # Add your existing scanner API request here.
          # Use the real endpoint and request payload from your backend.
          # Exit with code 1 if the scan fails or the score is below threshold.

          Write-Error "Scanner API request has not been configured."
          exit 1gg
